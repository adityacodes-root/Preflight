name: Terraform Plan Preflight Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "*.tf"

# Least-privilege permissions: write pull-requests comments, write security events for SARIF
permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  preflight-analysis:
    name: Validate Terraform Changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Preflight
        run: pip install preflight-engine

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Initialize and Generate Plan
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan

      - name: Generate and Upload SARIF to GitHub Code Scanning
        run: |
          terraform show -json tfplan | preflight analyze - \
            --environment staging \
            --format sarif \
            --output preflight.sarif

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: preflight.sarif

      - name: Publish Sticky PR Risk Report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          terraform show -json tfplan | preflight comment - \
            --environment staging \
            --fail-on high

      - name: Clean up Plan Artifacts
        if: always()
        run: |
          rm -f tfplan preflight.sarif
